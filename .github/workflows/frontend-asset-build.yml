name: Frontend Asset Build Pipeline
run-name: Build Frontend Assets
on: [push]
jobs:
  build-frontend-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: yarn install
      - run: yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: js/
